name: Test CI
on:
  push: { branches: ["main"] }
  pull_request: { branches: ["main"] }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        
    - run: make install
    - run: make lint
    - run: NODE_OPTIONS=--experimental-vm-modules npx jest --coverage --coverageReporters=lcov  
    
    - name: SonarCloud Scan
      if: success()
      uses: SonarSource/sonarcloud-github-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=Ledchig_frontend-project-46
          -Dsonar.organization=ledchig
          -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
          -Dsonar.sources=src,bin
          -Dsonar.tests=__tests__
          -Dsonar.exclusions=**/node_modules/**,**/__fixtures__/**,package*,eslint*

